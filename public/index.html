<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수업 준비 도우미</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="기능 메뉴">
      <a class="brand" href="index.html">수업 준비 도우미</a>
      <ul class="menu">
        <li><a href="quiz.html">퀴즈 생성기</a></li>
        <li><a href="activity.html">학습활동 추천</a></li>
      </ul>
    </nav>

    <main class="main">
      <div class="main-inner">
        <h1 class="page-title">수업 준비 도우미</h1>
        <p class="page-lead">수업 준비에 쓸 기능을 고르세요.</p>

        <div class="card-list">
          <section class="card" aria-labelledby="start-quiz">
            <h2 class="card-title" id="start-quiz">퀴즈 생성기</h2>
            <p class="card-text">단원이나 주제를 입력해 형성평가나 복습에 쓸 퀴즈 문항을 정답, 해설과 함께 받습니다.</p>
            <a class="button button--secondary" href="quiz.html">퀴즈 생성기 열기</a>
          </section>

          <section class="card" aria-labelledby="start-activity">
            <h2 class="card-title" id="start-activity">학습활동 추천</h2>
            <p class="card-text">학습 목표와 수업 조건을 입력해 그 시간 안에 할 수 있는 학습활동을 진행 순서와 함께 추천받습니다.</p>
            <a class="button button--secondary" href="activity.html">학습활동 추천 열기</a>
          </section>
        </div>
      </div>
    </main>
  </div>

</html>
